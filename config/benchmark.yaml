release: v0.1.0
mini_case: oxford-mini-v1

cases:
  open: [oxford-v1, leeds-v1, melbourne-v1, zurich-v1, toronto-v1]
  non_commercial: [leuven-v1]

limits:
  full_case_time_limit_s: 600
  mini_case_time_limit_s: 300
  full_case_threads: 8
  mini_case_threads: 2

smoke:
  tier: T2_synthetic_od
  modes: [walking, cycling, car, heavy]
  min_coverage: 0.5
  min_raw_rho:
    car: 0.3
  min_sites: 20

tools:
  baseline:
    tier: T1_open_covariates
    variants: [class_only, centre_distance, attractor_density, population_density]
    smoke_variant: class_only
  una:
    tier: T1_open_covariates
    variants: [default, shortest]
    smoke_variant: default
  cityseer_od:
    tier: T2_synthetic_od
    variants: [default, dispersed]
    smoke_variant: default
  aequilibrae:
    tier: T2_synthetic_od
    variants: [aon, ue_bfw]
    smoke_variant: aon
  sdna:
    tier: T0_network
    variants: [betweenness_angular, betweenness_euclidean, nqpd_euclidean, nqpd_angular]
    smoke_variant: betweenness_angular
    smoke_modes: [car]
