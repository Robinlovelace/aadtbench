project:
  type: website
  output-dir: _site
  render:
    - README.md
    - leaderboard.qmd
    - paper/index.qmd
    - BENCHMARK.md
    - IMPLEMENTATIONS.md
  resources:
    - leaderboard-summary.csv
    - assets/hero-benchmark.png

execute:
  freeze: auto

website:
  title: "AADTBench"
  site-url: https://robinlovelace.net/aadtbench
  repo-url: https://github.com/Robinlovelace/aadtbench
  repo-branch: main
  repo-actions: [edit, issue]
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: README.md
      - text: "Leaderboard"
        href: leaderboard.qmd
      - text: "Paper"
        href: paper/index.qmd
      - text: "Specification"
        href: BENCHMARK.md
      - text: "Add a tool"
        href: IMPLEMENTATIONS.md
    right:
      - text: "Releases"
        href: https://github.com/Robinlovelace/aadtbench/releases
      - icon: github
        href: https://github.com/Robinlovelace/aadtbench
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
